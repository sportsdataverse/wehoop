# Checks every URL in the package docs (DESCRIPTION, man/, vignettes, README, NEWS)
# with urlchecker, the same check CRAN runs. Monthly and on demand; it also runs on a
# PR that edits this file. URLs on stats.wnba.com, stats.nba.com, stats.ncaa.org and
# sports-reference are dropped before checking: those hosts block or stall datacenter
# IPs, and SDV never calls them from cloud runners. Check them by hand from a
# residential IP before a CRAN submission.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 1 * *"
  pull_request:
    branches:
      - main
      - master
    paths:
      - .github/workflows/urlchecker.yaml

name: urlchecker

permissions:
  contents: read

jobs:
  urlchecker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Only the steps that call GitHub get the token: installing remotes, and
      # url_check(), which sends it with github.com requests (unauthenticated
      # ones get rate-limited, and urlchecker 2.0.0 ignores a 429).
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        with:
          packages: any::urlchecker

      - name: Check URLs
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          db <- urlchecker:::build_url_db(normalizePath(".", winslash = "/"))
          blocked <- "^https?://([a-z0-9-]+[.])*(stats[.]wnba[.]com|stats[.]nba[.]com|stats[.]ncaa[.]org|sports-reference[.]com|basketball-reference[.]com)"
          skip <- grepl(blocked, db$URL, ignore.case = TRUE)
          message(sum(skip), " URL(s) on datacenter-blocked hosts not checked:")
          writeLines(unique(db$URL[skip]))
          res <- urlchecker::url_check(".", db = db[!skip, ], fail = FALSE)
          print(res)
          if (NROW(res) > 0) stop(NROW(res), " URL problem(s); see the table above")
        shell: Rscript {0}
