# Checks every URL in the package docs (DESCRIPTION, man/, vignettes, README, NEWS)
# with urlchecker, the same check CRAN runs. Monthly and on demand; it also runs on a
# PR that edits this file. Some hosts (stats.wnba.com, sports-reference) refuse or
# stall datacenter IPs, so read failures for those against cran-comments.md.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 1 * *"
  pull_request:
    branches:
      - main
      - master
    paths:
      - .github/workflows/urlchecker.yaml

name: urlchecker

permissions:
  contents: read

jobs:
  urlchecker:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::urlchecker

      - name: Check URLs
        run: |
          res <- urlchecker::url_check(".")
          print(res)
          if (NROW(res) > 0) stop(NROW(res), " URL problem(s); see the table above")
        shell: Rscript {0}
