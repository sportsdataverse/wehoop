# For help debugging build failures open an issue on the RStudio community with the 'github-actions' tag.
# https://community.rstudio.com/new-topic?category=Package%20development&tags=github-actions
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "30 12 * * Fri"

name: R-CMD-check

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    # R-devel is an early warning for the CRAN r-devel flavours, not a merge gate.
    continue-on-error: ${{ matrix.config.r == 'devel' }}
    # A hung step (e.g. an example stalling on a datacenter-blocked host) must not burn 6 h.
    timeout-minutes: 60

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-latest, r: "release" }
          - { os: windows-latest, r: "release" }
          - { os: ubuntu-latest, r: "devel", http-user-agent: "release" }
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-latest, r: "oldrel-1" }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Live API toggles. Repository variables, not secrets: secret values are masked in
      # every log line, and these are single digits. They do not make CI hit live APIs:
      # tests/testthat/helper-skip.R calls skip_on_ci() before reading them.
      WNBA_STATS_TESTS: ${{ vars.WNBA_STATS_TESTS }}
      ESPN_TESTS: ${{ vars.ESPN_TESTS }}
      NCAA_WBB_TESTS: ${{ vars.NCAA_WBB_TESTS }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
