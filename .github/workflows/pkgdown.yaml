on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

concurrency:
  group: pkgdown-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pkgdown:
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: 'ubuntu-latest',   r: 'release'}
    env:
      R_KEEP_PKG_SOURCE: yes
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Setting up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - name: Setting up R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          extra-packages: |
            any::pkgdown
            any::animation
            any::fastRhockey
            any::ggimage
            any::hexbin
            any::hoopR
            any::knitr
            any::oddsapiR
            any::pacman
            any::pak
            any::ragg
            any::remotes
            any::rsconnect
            any::sportyR
            any::tictoc
            any::zoo
            github::sportsdataverse/sdvplotR
            local::.
          needs: website
      - name: Build site
        # interactive() is TRUE for this build, so the @examplesIf interactive()
        # examples run and their output is shown on the site; the ones that
        # call sites we don't scrape from CI also check Sys.getenv("CI").
        run: |
          unlockBinding("interactive", baseenv())
          assign("interactive", function() TRUE, envir = baseenv())
          pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      # pkgdown renders every top-level and .github/*.md file; the agent and
      # contributor-tooling notes are not user documentation, so drop their
      # pages (and .md copies) and their sitemap / llms.txt entries.
      - name: Keep contributor and agent notes off the site
        run: |
          for page in CLAUDE copilot-instructions PULL_REQUEST_TEMPLATE pull_request_template; do
            rm -f "docs/$page.html" "docs/$page.md"
          done
          perl -0pi -e 's{\s*<url>\s*<loc>[^<]*/(?:CLAUDE|copilot-instructions|PULL_REQUEST_TEMPLATE|pull_request_template)\.html</loc>\s*</url>}{}g' docs/sitemap.xml
          if [ -f docs/llms.txt ]; then
            perl -ni -e 'print unless /(?:CLAUDE|copilot-instructions|PULL_REQUEST_TEMPLATE|pull_request_template)\.(?:html|md)/' docs/llms.txt
          fi
          if grep -qiE 'CLAUDE|copilot-instructions|pull_request_template' docs/sitemap.xml; then exit 1; fi
          if ls docs/CLAUDE.html docs/copilot-instructions.html 2>/dev/null; then exit 1; fi
      # clean: true replaces the whole branch with the fresh build, which also
      # removes the pages earlier builds published.
      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: true
          branch: gh-pages
          folder: docs
