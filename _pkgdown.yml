url: https://wehoop.sportsdataverse.org/
template:
  bootstrap: 5
  bootswatch: flatly
  ganalytics: G-9CQMXE1XGT
  includes:
    in_header: |
      <script defer data-domain="wehoop.sportsdataverse.org" src="https://plausible.io/js/plausible.js"></script>
  bslib:
    primary: "#221A4D"
    secondary: "#b298dc"
    success: "#c2bccc"
    link-color: "#7c689c"
    link-hover-color: "#c2bccc"
    nav-link-hover-color: "#c2bccc"
    nav-link-focus-color: "#c2bccc"
    nav-link-dropdown-toggle-hover-color: "#c2bccc"
    navbar-hover-color: "#c2bccc"
    navbar-brand-hover-color: "#c2bccc"
    nav-tabs-link-active-bg	: "#c2bccc"
    nav-pills-link-active-color: "#c2bccc"
    btn-link-color: "#c2bccc"
    btn-link-hover-color: "#c2bccc"
    dropdown-link-color: "#c2bccc"
    input-btn-focus-color: "#c2bccc"
    dropdown-dark-link-hover-bg: "#c2bccc"
    border-radius: 0.5rem
    btn-border-radius: 0.25rem
  opengraph:
    image:
      src: "https://raw.githubusercontent.com/sportsdataverse/wehoop-data/main/themes/wehoop_gh.png"
    twitter:
      creator: "@saiemgilani"
      site: "@sportsdataverse"
      card: summary_large_image

      
authors:
  Saiem Gilani:
    href: https://x.com/saiemgilani
  Geoffery Hutchinson:
    href: https://x.com/hutchngo


